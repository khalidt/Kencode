[metadata]
name             = Kencode
version          = 1.0.0
author           = Khalid Alkhaldi
author_email     = k.t.alkhaldi@gmail.com
description      = Accessible programming through natural language — bidirectional Python ↔ Kencode converter
long_description = file: README.md
long_description_content_type = text/markdown
url              = https://khalidalkhaldi.pythonanywhere.com/
project_urls     =
    Repository    = https://github.com/khalidt/kencode
    License       = https://creativecommons.org/licenses/by-nc-sa/4.0/
    Documentation = https://github.com/khalidt/kencode#readme
    Bug Tracker   = https://github.com/khalidt/kencode/issues
    Paper         = https://doi.org/10.18293/JVLC2025-N3-079
license          = CC BY-NC-SA 4.0
license_files    = LICENSE
classifiers      =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Education
    Intended Audience :: Science/Research
    Topic :: Software Development :: Code Generators
    Topic :: Scientific/Engineering :: Human Machine Interfaces
    Topic :: Accessibility
    License :: Other/Proprietary License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Operating System :: OS Independent
keywords         =
    accessibility
    voice programming
    natural language
    python converter
    kencode
    assistive technology
    code verbalization
    inclusive programming

[options]
packages         = find:
python_requires  = >=3.9
include_package_data = True

[options.entry_points]
console_scripts =
    kencode        = kencode.kencode_converter:main_cli
    kencode-decode = kencode.kencode_decoder:main_cli

[options.package_data]
kencode = py.typed

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0
    build>=1.0
    twine>=4.0
